site_name: GPS-DTW
site_description: Map matching of GPS traces with dynamic time warping, one second on both sides, in Rust.
site_url: https://khoshkhah.github.io/gps-dtw/
repo_url: https://github.com/Khoshkhah/gps-dtw
repo_name: Khoshkhah/gps-dtw

theme:
  name: material
  logo: assets/gpsdtw-mark-inverse.svg
  favicon: assets/gpsdtw-mark.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.footer
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify { kwds: { case: lower } }

plugins:
  - search

nav:
  - Home: index.md
  - Start:
      - Overview: start/index.md
      - Install: start/install.md
      - Your first match: start/first_match.md
  - How it works:
      - Overview: concepts/index.md
      - What DTW is: concepts/dtw.md
      - The steps: concepts/steps.md
      - One second on both sides: concepts/time-division.md
      - Segment mode and node mode: concepts/cost.md
      - The confidence weight: concepts/confidence.md
  - Reference:
      - Overview: reference/index.md
      - Parameters: reference/parameters.md
      - Python API: reference/python.md
  - Results:
      - Overview: results/index.md
      - Comparison with the HMM: results/compare.md
      - Effect of the parameters: results/parameters.md
      - Test data: results/data.md
