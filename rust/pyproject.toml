[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "gps-dtw"
version = "0.1.0"
description = "GPS-DTW: map matching of GPS traces with dynamic time warping"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.maturin]
module-name = "gps_dtw"
profile = "release"
