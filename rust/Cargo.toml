[package]
name = "gps-dtw"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Kaveh Khoshkhah"]
description = "GPS-DTW: map matching of GPS traces with dynamic time warping"

[lib]
# The Python module gps_dtw. core.rs is plain Rust; lib.rs is the pyo3 binding.
name = "gps_dtw"
crate-type = ["cdylib", "rlib"]

[features]
# the Python module (maturin builds it); off for a Rust program that uses only `core`
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py39", "extension-module"], optional = true }
rstar = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
